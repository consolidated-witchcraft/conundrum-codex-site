doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            rarity: App\Doctrine\Types\RarityType
            email: App\Doctrine\Types\EmailType
            non_empty_string: App\Doctrine\Types\NonEmptyStringType
            puzzle_config_fields: App\Doctrine\Types\PuzzleConfigFieldType
            payment_status: App\Doctrine\Types\PaymentStatusType
            order_status: App\Doctrine\Types\OrderStatusType
            charge_type: App\Doctrine\Types\ChargeTypeType
            product_type: App\Doctrine\Types\ProductTypeType
            ticket_format: App\Doctrine\Types\TicketFormatType
            preferred_font_stack: App\Doctrine\Types\PreferredFontStackType
            markdown: App\Doctrine\Types\MarkdownType

    orm:
        auto_generate_proxy_classes: false
        enable_lazy_ghost_objects: true
        enable_native_lazy_objects: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

            Core:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Core/Domain'
                prefix: 'App\Services\Core\Domain'
                alias: Core

            Campaign:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Campaign/Domain'
                prefix: 'App\Services\Campaign\Domain'
                alias: Campaign

            User:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/User/Domain'
                prefix: 'App\Services\User\Domain'
                alias: User

            PuzzleInstance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/PuzzleInstance/Domain'
                prefix: 'App\Services\PuzzleInstance\Domain'
                alias: PuzzleInstance

            PuzzleTemplate:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/PuzzleTemplate/Domain'
                prefix: 'App\Services\PuzzleTemplate\Domain'
                alias: PuzzleTemplate

            Quotation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Quotation/Domain'
                prefix: 'App\Services\Quotation\Domain'
                alias: Quotation

            Abuse:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Abuse/Domain'
                prefix: 'App\Services\Abuse\Domain'
                alias: Abuse

            BlockedEmailAddress:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/BlockedEmailAddress/Domain'
                prefix: 'App\Services\BlockedEmailAddress\Domain'
                alias: BlockedEmailAddress

            BugReport:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/BugReport/Domain'
                prefix: 'App\Services\BugReport\Domain'
                alias: BugReport

            Game:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Game/Domain'
                prefix: 'App\Services\Game\Domain'
                alias: Game

            ManagedFile:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/ManagedFiles/Domain'
                prefix: 'App\Services\ManagedFiles\Domain'
                alias: Game

            PostalAddress:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/PostalAddress/Domain'
                prefix: 'App\Services\PostalAddress\Domain'
                alias: PostalAddress

            Events:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Events/Domain'
                prefix: 'App\Services\Events\Domain'
                alias: Events

            Orders:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Orders/Domain'
                prefix: 'App\Services\Orders\Domain'
                alias: Orders

            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Payment/Domain'
                prefix: 'App\Services\Payment\Domain'
                alias: Payment

            Ticket:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Ticket/Domain'
                prefix: 'App\Services\Ticket\Domain'
                alias: Ticket

            Product:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/Product/Domain'
                prefix: 'App\Services\Product\Domain'
                alias: Ticket

            FeatureSwitcher:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/FeatureSwitcher/Domain'
                prefix: 'App\Services\FeatureSwitcher\Domain'
                alias: FeatureSwitcher

            ManagedImage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/ManagedImages/Domain'
                prefix: 'App\Services\ManagedImages\Domain'
                alias: ManagedImages

            World:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/World/Domain'
                prefix: 'App\Services\World\Domain'
                alias: World

            PlayEvent:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Services/PlayEvent/Domain'
                prefix: 'App\Services\PlayEvent\Domain'
                alias: PlayEvent

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
